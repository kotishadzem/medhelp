version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medhelp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medhelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medhelp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medhelp}
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medhelp-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medhelp.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres

volumes:
  pgdata:
