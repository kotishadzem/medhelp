services:
  postgres:
    image: postgres:16-alpine
    container_name: medhelp-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medhelp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medhelp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-medhelp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medhelp} -d ${POSTGRES_DB:-medhelp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: mamukakotishadze/medhelp-backend
    build:
      context: ./backend
    container_name: medhelp-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_HOST_PORT:-3002}:3002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://medhelp:medhelp_secret@postgres:5432/medhelp?schema=public}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: mamukakotishadze/medhelp-web
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-/api}
    container_name: medhelp-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started

  migrator:
    image: mamukakotishadze/medhelp-migrator
    build:
      context: ./backend
      target: builder
    profiles: [migrate]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://medhelp:medhelp_secret@postgres:5432/medhelp?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]

volumes:
  pgdata:
  uploads:
