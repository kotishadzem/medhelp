name: cicd-aws

on:
  push:
    branches: [stable, main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        env:
          BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
          WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
        run: docker compose -f docker-compose.yml --profile migrate build

      - name: Log in to Docker Hub
        if: github.ref_name == vars.DEPLOY_BRANCH
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push images
        if: github.ref_name == vars.DEPLOY_BRANCH
        run: |
          docker tag mamukakotishadze/medhelp-backend mamukakotishadze/medhelp-backend:${SHORT_SHA}
          docker push mamukakotishadze/medhelp-backend
          docker push mamukakotishadze/medhelp-backend:${SHORT_SHA}
          docker tag mamukakotishadze/medhelp-migrator mamukakotishadze/medhelp-migrator:${SHORT_SHA}
          docker push mamukakotishadze/medhelp-migrator
          docker push mamukakotishadze/medhelp-migrator:${SHORT_SHA}
          docker tag mamukakotishadze/medhelp-web mamukakotishadze/medhelp-web:${SHORT_SHA}
          docker push mamukakotishadze/medhelp-web
          docker push mamukakotishadze/medhelp-web:${SHORT_SHA}

  deploy:
    needs: build
    if: github.ref_name == vars.DEPLOY_BRANCH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure remote app directory
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/apps/${{ vars.COMPOSE_PROJECT_NAME }}"

      - name: Copy compose file
        run: |
          scp -i ~/.ssh/id_ed25519 docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/apps/${{ vars.COMPOSE_PROJECT_NAME }}/docker-compose.yml

      - name: Write .env on remote
        env:
          BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
          WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT }}
          COMPOSE_PROJECT_NAME: ${{ vars.COMPOSE_PROJECT_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cat > ~/apps/${{ vars.COMPOSE_PROJECT_NAME }}/.env" <<EOF
          BACKEND_HOST_PORT=$BACKEND_HOST_PORT
          WEB_HOST_PORT=$WEB_HOST_PORT
          COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          EOF

      - name: Apply Prisma migrations
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/apps/${{ vars.COMPOSE_PROJECT_NAME }} && docker compose --profile migrate pull migrator && docker compose --profile migrate run --rm migrator"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/apps/${{ vars.COMPOSE_PROJECT_NAME }} && docker compose pull && docker compose up -d --remove-orphans"

      - name: Verify all services running
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ~/apps/${{ vars.COMPOSE_PROJECT_NAME }} && docker compose ps --format json" \
            | jq -sce 'all(.[]; .State == "running")'

      - name: Prune old images on EC2
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "docker image prune -f"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
